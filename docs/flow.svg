<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowRight" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#6933FF" stroke-width="1.2"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#484f58" stroke-width="1.2"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#f85149" stroke-width="1.2"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#37A806" stroke-width="1.2"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#f0883e" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="350" fill="#0d1117" rx="8"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#e6edf3" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Request Flow Through the Middleware Pipeline</text>

  <!-- === Main Flow (y=110 center line) === -->

  <!-- 1. Request -->
  <rect x="18" y="88" width="88" height="44" rx="20" fill="#21262d" stroke="#6933FF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="62" y="114" text-anchor="middle" fill="#c9b1ff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Request</text>

  <!-- Arrow -->
  <line x1="106" y1="110" x2="130" y2="110" stroke="#6933FF" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- 2. ASGI Middleware -->
  <rect x="132" y="82" width="112" height="56" rx="6" fill="#161b22" stroke="#6933FF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="188" y="104" text-anchor="middle" fill="#c9b1ff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">ASGI</text>
  <text x="188" y="117" text-anchor="middle" fill="#c9b1ff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">Middleware</text>
  <text x="188" y="132" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="8">X-Region header</text>

  <!-- Arrow -->
  <line x1="244" y1="110" x2="268" y2="110" stroke="#6933FF" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- 3. Region Context -->
  <rect x="270" y="82" width="108" height="56" rx="6" fill="#161b22" stroke="#37A806" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="324" y="104" text-anchor="middle" fill="#7ee787" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">Region</text>
  <text x="324" y="117" text-anchor="middle" fill="#7ee787" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">Context</text>
  <text x="324" y="132" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="8">contextvars</text>

  <!-- Arrow -->
  <line x1="378" y1="110" x2="402" y2="110" stroke="#6933FF" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- 4. Circuit Breaker -->
  <rect x="404" y="82" width="108" height="56" rx="6" fill="#161b22" stroke="#37A806" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="458" y="104" text-anchor="middle" fill="#7ee787" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">Circuit</text>
  <text x="458" y="117" text-anchor="middle" fill="#7ee787" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">Breaker</text>
  <text x="458" y="132" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="8">open/half/closed</text>

  <!-- Arrow -->
  <line x1="512" y1="110" x2="536" y2="110" stroke="#6933FF" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- 5. Retry Engine -->
  <rect x="538" y="82" width="108" height="56" rx="6" fill="#161b22" stroke="#37A806" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="592" y="104" text-anchor="middle" fill="#7ee787" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">Retry</text>
  <text x="592" y="117" text-anchor="middle" fill="#7ee787" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">Engine</text>
  <text x="592" y="132" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="8">exp backoff+jitter</text>

  <!-- Arrow -->
  <line x1="646" y1="110" x2="670" y2="110" stroke="#6933FF" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- 6. DB Operation -->
  <rect x="672" y="82" width="100" height="56" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="722" y="104" text-anchor="middle" fill="#e6edf3" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">Database</text>
  <text x="722" y="117" text-anchor="middle" fill="#e6edf3" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">Operation</text>
  <text x="722" y="132" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="8">SQL / ORM</text>

  <!-- Arrow to CockroachDB -->
  <line x1="772" y1="110" x2="798" y2="110" stroke="#6933FF" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- 7. CockroachDB -->
  <rect x="800" y="82" width="82" height="56" rx="6" fill="#6933FF" stroke="#c9b1ff" stroke-width="1" filter="url(#shadow)"/>
  <text x="841" y="107" text-anchor="middle" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">Cockroach</text>
  <text x="841" y="120" text-anchor="middle" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">DB</text>

  <!-- === Retry Loop === -->
  <!-- Error path: DB -> 40001 Error box -->
  <line x1="722" y1="138" x2="722" y2="184" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="668" y="186" width="108" height="36" rx="6" fill="#21262d" stroke="#f85149" stroke-width="1.5"/>
  <text x="722" y="202" text-anchor="middle" fill="#f85149" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">40001 Error</text>
  <text x="722" y="215" text-anchor="middle" fill="#f85149" font-family="monospace" font-size="8">serialization failure</text>

  <!-- Retry arrow: 40001 Error -> back to Retry Engine -->
  <path d="M668,204 L592,204 L592,140" fill="none" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <text x="628" y="197" text-anchor="middle" fill="#f0883e" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600">retry</text>

  <!-- Retry exhausted path -->
  <line x1="722" y1="222" x2="722" y2="252" stroke="#f85149" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowRed)"/>
  <rect x="653" y="254" width="138" height="28" rx="4" fill="#21262d" stroke="#f85149" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="722" y="272" text-anchor="middle" fill="#f85149" font-family="monospace" font-size="9">RetryExhausted</text>

  <!-- === Follower Read Path === -->
  <!-- Branch from Region Context downward -->
  <line x1="324" y1="138" x2="324" y2="184" stroke="#37A806" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="258" y="186" width="132" height="50" rx="6" fill="#161b22" stroke="#37A806" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="324" y="206" text-anchor="middle" fill="#7ee787" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">Follower Read</text>
  <text x="324" y="220" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="8">AS OF SYSTEM TIME</text>
  <text x="324" y="232" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="8">follower_read_timestamp()</text>

  <!-- Follower read direct to DB (bypasses retry) -->
  <path d="M390,211 L820,211 L841,138" fill="none" stroke="#37A806" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <text x="600" y="205" text-anchor="middle" fill="#37A806" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600">read-only (no retry needed)</text>

  <!-- === Legend === -->
  <line x1="30" y1="320" x2="60" y2="320" stroke="#6933FF" stroke-width="1.5"/>
  <text x="66" y="324" fill="#8b949e" font-family="Inter, system-ui, sans-serif" font-size="10">Main request path</text>

  <line x1="200" y1="320" x2="230" y2="320" stroke="#37A806" stroke-width="1.5"/>
  <text x="236" y="324" fill="#8b949e" font-family="Inter, system-ui, sans-serif" font-size="10">Follower read path</text>

  <line x1="390" y1="320" x2="420" y2="320" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="426" y="324" fill="#8b949e" font-family="Inter, system-ui, sans-serif" font-size="10">Retry loop</text>

  <line x1="530" y1="320" x2="560" y2="320" stroke="#f85149" stroke-width="1.5"/>
  <text x="566" y="324" fill="#8b949e" font-family="Inter, system-ui, sans-serif" font-size="10">Error path</text>

  <text x="700" y="324" fill="#484f58" font-family="Inter, system-ui, sans-serif" font-size="9">cockroachdb-core middleware pipeline</text>
</svg>
