[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cockroachdb-ai"
version = "0.1.1"
description = "CockroachDB AI — vector search, RAG pipelines, and embedding providers for pgvector"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Felipe Gutierrez" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "cockroachdb>=0.1.0",
    "cockroachdb-core>=0.1.0",
    "pgvector>=0.3",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
local = ["sentence-transformers>=2.0"]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
cockroachdb = { workspace = true }
cockroachdb-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cockroachdb"]
