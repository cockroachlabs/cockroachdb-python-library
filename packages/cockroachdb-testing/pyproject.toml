[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cockroachdb-testing"
version = "0.1.1"
description = "CockroachDB Python Library — test fixtures, simulators, and factories"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Felipe Gutierrez" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "cockroachdb>=0.1.0",
    "cockroachdb-core>=0.1.0",
    "pytest>=8.0",
    "testcontainers[cockroachdb]>=4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.uv.sources]
cockroachdb = { workspace = true }
cockroachdb-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cockroachdb"]
