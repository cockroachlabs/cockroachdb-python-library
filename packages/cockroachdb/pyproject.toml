[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cockroachdb"
version = "0.1.4"
description = "CockroachDB Python Library — base decorators, types, and configuration"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Felipe Gutierrez" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cockroachdb"]

# Bake the consumer-facing agent guide into the installed package so it lands at
# cockroachdb/AGENTS.md (readable via importlib.resources). Single source of truth
# is the shared docs/agents/AGENTS.md at the repo root. The sdist pulls it into the
# package dir; the wheel (built from the sdist by `uv build`) then includes it
# automatically alongside the package's .py files. (A wheel-level force-include
# can't be used here: it would have to reference a path valid only in the sdist,
# which breaks editable/source wheel builds used by `uv sync`.)
[tool.hatch.build.targets.sdist.force-include]
"../../docs/agents/AGENTS.md" = "src/cockroachdb/AGENTS.md"
