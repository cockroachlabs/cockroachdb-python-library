[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cockroachdb-cdc"
version = "0.1.1"
description = "CockroachDB Change Data Capture — webhook handlers, changefeed management, and framework integration"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Felipe Gutierrez" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "cockroachdb>=0.1.0",
    "cockroachdb-core>=0.1.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
flask = ["flask>=3.0"]
metrics = ["prometheus-client"]
all = ["fastapi>=0.100", "flask>=3.0", "prometheus-client"]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv.sources]
cockroachdb = { workspace = true }
cockroachdb-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cockroachdb"]
